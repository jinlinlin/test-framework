# Kubernetes Service — 测试框架服务暴露
apiVersion: v1
kind: Service
metadata:
  name: test-framework
  labels:
    app: test-framework
spec:
  type: ClusterIP
  selector:
    app: test-framework
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# NodePort 服务（用于外部访问）
apiVersion: v1
kind: Service
metadata:
  name: test-framework-nodeport
  labels:
    app: test-framework
spec:
  type: NodePort
  selector:
    app: test-framework
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
