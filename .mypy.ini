# ============================================================
# .mypy.ini — Python 静态类型检查配置
# ============================================================
[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
ignore_missing_imports = True
no_implicit_optional = True
strict_optional = True

# ---------- 排除目录 ----------
exclude = (?x)(
    build/
    | dist/
    | \.venv/
    | node_modules/
    | tests/
  )

# ---------- 第三方库忽略类型检查 ----------
[mypy-grpc.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-motor.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-aiomysql.*]
ignore_missing_imports = True

[mypy-aiokafka.*]
ignore_missing_imports = True

[mypy-aio_pika.*]
ignore_missing_imports = True

[mypy-allure.*]
ignore_missing_imports = True
