# ============================================================
# 越权测试引擎 — 默认配置
# ============================================================

auth_bypass:
  # 启用的测试策略
  strategies:
    - role_escalation      # 角色提权
    - session_fixation     # 会话固定
    - token_replay         # Token 重放
    - jwt_attack           # JWT 攻击
    - oauth_attack         # OAuth 攻击
    - idor                 # 不安全的直接对象引用

  # 基础设置
  timeout: 30              # 请求超时（秒）
  max_attempts: 100        # 每种策略最大尝试次数
  concurrency: 5           # 并发测试数

  # 检测灵敏度
  detection_sensitivity: medium  # low / medium / high

  # 角色提权配置
  role_escalation:
    roles:
      - admin
      - manager
      - user
      - guest
    test_horizontal: true  # 水平越权测试
    test_vertical: true    # 垂直越权测试

  # JWT 攻击配置
  jwt_attack:
    algorithms:
      - none               # 无签名算法攻击
      - RS256_to_HS256     # 算法混淆攻击
    check_expiry: true     # 检查过期时间

  # OAuth 攻击配置
  oauth_attack:
    check_redirect_uri: true
    check_state_param: true
    check_scope_escalation: true

  # IDOR 配置
  idor:
    parameter_types:
      - sequential_id      # 递增 ID
      - uuid               # UUID
      - base64             # Base64 编码 ID
    max_id_range: 100      # ID 遍历范围
