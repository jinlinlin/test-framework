# pytest 入口（A′-3 最小子集移植自 agent-test/pytest.ini）：
# 离线契约闭环只需标记注册与用例发现规则；源仓 addopts 中的 HTML/Allure 报告与
# reruns 重试属 Layer 1 原生报告与稳定性策略，待真实环境用例批量移植时一并回补，
# 届时须同步确认 pytest-html / pytest-rerunfailures 依赖已安装。
[pytest]
testpaths = test_cases
pythonpath = .
addopts =
    -v
    --tb=short
markers =
    agent: Agent行为测试
    rag: 知识库对话
    paper: 论文AI
    robust: 鲁棒安全
    judge: 质量评测
    flaky: 遗留标记（重试策略回补后由全局配置接管）
    offline: 离线判定函数回归（不打真实服务，秒级完成）
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    # 测试环境使用自签名 HTTPS 证书，抑制 urllib3 InsecureRequestWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
