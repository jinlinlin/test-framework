# docker-compose.dev.yml — 开发环境编排（含热重载和调试端口）
version: "3.8"

services:
  framework:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: test-framework-dev
    volumes:
      - ..:/app
    environment:
      - TF_ENV=dev
      - TF_DEBUG=true
      - TF_LOG_LEVEL=DEBUG
    ports:
      - "5678:5678"   # debugpy 远程调试端口
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "test_framework"]
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_dev
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
