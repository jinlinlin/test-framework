# docker-compose.yml — 框架 + 依赖服务编排
version: "3.8"

services:
  # 测试框架主服务
  framework:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: test-framework
    volumes:
      - ../config:/app/config
      - ../reports:/app/reports
      - ../results:/app/results
      - ../logs:/app/logs
    environment:
      - TF_ENV=test
      - TF_LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://test:test@postgres:5432/test
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - test-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - test-network

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: test-postgres
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - test-network

volumes:
  postgres-data:

networks:
  test-network:
    driver: bridge
