# web_test.yaml — Web 性能测试样本配置
test:
  name: "Web 性能冒烟测试"
  type: "web_performance"
  target:
    url: "https://example.com"
    pages:
      - "/"
      - "/login"
      - "/dashboard"
  browser:
    type: "chromium"
    headless: true
    viewport:
      width: 1920
      height: 1080
  thresholds:
    lcp_ms: 2500
    fid_ms: 100
    cls: 0.1
    ttfb_ms: 600
  network_conditions:
    preset: "fast_3g"
  concurrency: 5
  timeout: 30
